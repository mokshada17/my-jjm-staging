apiVersion: v1
kind: Service
metadata:
  name: mosquitto
  namespace: mqtt
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: mosquitto
  ports:
    - name: mqtt
      port: 1883
      targetPort: 1883
      nodePort: 31883
    - name: mqtts
      port: 8883
      targetPort: 8883
      nodePort: 31884
