apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jjm-frontend-ingress
  namespace: jjm
  labels:
    app: jjm-frontend
    tier: frontend
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/use-regex: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jjm-frontend-svc
                port:
                  number: 80
