apiVersion: v1
kind: Service
metadata:
  name: pi-mock-service
  namespace: jjm
  labels:
    app: pi-mock-server
    tier: mock
spec:
  type: ClusterIP
  selector:
    app: pi-mock-server
  ports:
    - name: http
      port: 3001
      targetPort: http
      protocol: TCP
---
# Service alias so frontend's "http://backend.jjm.svc.cluster.local:8000" reaches the mock
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: jjm
  labels:
    app: pi-mock-server
    tier: mock
spec:
  type: ClusterIP
  selector:
    app: pi-mock-server
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
---
# Service alias for backend-service
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: jjm
  labels:
    app: pi-mock-server
    tier: mock
spec:
  type: ClusterIP
  selector:
    app: pi-mock-server
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
