apiVersion: apps/v1
kind: Deployment
metadata:
  name: pi-mock-server
  namespace: jjm
  labels:
    app: pi-mock-server
    tier: mock
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pi-mock-server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: pi-mock-server
        tier: mock
        environment: staging
    spec:
      imagePullSecrets:
        - name: ecr-creds
      terminationGracePeriodSeconds: 30
      containers:
        - name: pi-mock-server
          image: 463200133991.dkr.ecr.ap-southeast-1.amazonaws.com/pi-mock-server:v1
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: HOST
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
