apiVersion: v1
kind: ConfigMap
metadata:
  name: jjm-frontend-nginx-conf
  namespace: jjm
  labels:
    app: jjm-frontend
    tier: frontend
data:
  nginx.conf: |
    pid /tmp/nginx.pid;
    worker_processes auto;
    error_log /dev/stderr warn;

    events {
        worker_connections 1024;
    }

    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        access_log /dev/stdout;

        sendfile on;
        keepalive_timeout 65;
        gzip on;
        gzip_types text/plain text/css application/javascript application/json image/svg+xml;

        client_body_temp_path /tmp/client_temp;
        proxy_temp_path       /tmp/proxy_temp;
        fastcgi_temp_path     /tmp/fastcgi_temp;
        uwsgi_temp_path       /tmp/uwsgi_temp;
        scgi_temp_path        /tmp/scgi_temp;

        server {
            listen 8080;
            server_name _;

            location = /healthz {
                access_log off;
                return 200 "ok\n";
            }

            # 1. PI Web API calls -> proxy to pi-mock-service
            location /piwebapi/ {
                resolver 10.96.0.10 ipv6=off valid=10s;
                set $pi_backend http://pi-mock-service.jjm.svc.cluster.local:3001;
                proxy_pass $pi_backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # 2. General backend API calls -> proxy to backend:8000
            location /api/ {
                resolver 10.96.0.10 ipv6=off valid=10s;
                set $backend http://backend.jjm.svc.cluster.local:8000;
                rewrite ^/api/(.*)$ /$1 break;
                proxy_pass $backend;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            }

            # 3. Static SPA
            location / {
                root /usr/share/nginx/html;
                index index.html;
                try_files $uri $uri/ /index.html;
            }
        }
    }
