apiVersion: v1
kind: Service
metadata:
  name: jjm-frontend-svc
  namespace: jjm
  labels:
    app: jjm-frontend
    tier: frontend
spec:
  type: NodePort
  externalTrafficPolicy: Local
  selector:
    app: jjm-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
      protocol: TCP
