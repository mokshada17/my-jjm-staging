apiVersion: apps/v1
kind: Deployment
metadata:
  name: jjm-frontend
  namespace: jjm
  labels:
    app: jjm-frontend
    tier: frontend
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jjm-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: jjm-frontend
        tier: frontend
        environment: staging
    spec:
      terminationGracePeriodSeconds: 30
      imagePullSecrets:
        - name: ecr-secret
      containers:
        - name: frontend
          image: 463200133991.dkr.ecr.ap-south-1.amazonaws.com/jjm-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
              protocol: TCP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 3
            timeoutSeconds: 3
          securityContext:
            runAsNonRoot: true
            runAsUser: 101            # nginx user in official alpine image
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
