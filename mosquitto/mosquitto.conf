per_listener_settings true

# Internal plain MQTT — backend only, NOT internet-facing
listener 1883 0.0.0.0
protocol mqtt
allow_anonymous false
password_file /mosquitto/config/passwd_internal
acl_file /mosquitto/config/mosquitto-acl

# External TLS MQTT — field devices
listener 8883 0.0.0.0
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false
tls_version tlsv1.2
allow_anonymous false
password_file /mosquitto/config/passwd_sensors
acl_file /mosquitto/config/mosquitto-acl

# Optional websocket (dashboard live view, etc.)
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false
password_file /mosquitto/config/passwd_sensors
acl_file /mosquitto/config/mosquitto-acl

persistence true
persistence_location /mosquitto/data/
log_dest stdout
connection_messages true
max_queued_messages 5000
